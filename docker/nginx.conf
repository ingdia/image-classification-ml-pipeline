# Nginx: single entry point and load balancer.
#
# Docker's internal DNS returns one IP per running "api" container. Re-resolving
# the name every 5s (resolver + variable in proxy_pass) means that after
# `docker compose up --scale api=N` nginx spreads requests round-robin across all
# N replicas without needing a restart.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 200m;   # bulk uploads of many scans

    set $api_upstream http://api:8000;

    # API: /api/predict -> api:8000/predict
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        add_header X-Upstream $upstream_addr always;   # shows which replica answered
    }

    # Swagger docs through the balancer
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass $api_upstream;
    }

    # Frontend (static React build) is added in the dashboard phase
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
